services:
  mysql:
    image: mysql:8.4
    container_name: campus-hub-mysql
    environment:
      MYSQL_DATABASE: campus_hub
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456@
      MYSQL_ROOT_PASSWORD: root_demo_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: campus-hub-backend:latest
    container_name: campus-hub-backend
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/campus_hub?useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: campus_app
      DB_PASSWORD: campus_hub_password
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

volumes:
  mysql_data: